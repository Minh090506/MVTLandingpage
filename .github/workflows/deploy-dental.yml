name: Deploy VietnamDentalTravel

# Dental subdomain (implant.vietnamdentaltravel.com) runs the SAME unified worker.js
# generated by build.js — this workflow just rebuilds and re-deploys under the
# `vietnamdentaltravel` worker name so the custom_domain route stays bound.
on:
  push:
    branches: [main]
    paths:
      - 'pages/dental-implants-vietnam/**'
      - 'build.js'
      - 'data/**'
      - 'worker-modules/**'
      - 'wrangler-dental.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Same gate as deploy.yml. Without it this fast path is a way to ship a page
      # with missing tracking or a broken image URL straight to production.
      - name: Validate landing pages
        run: node scripts/validate-landing-pages.js
      - run: node build.js
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-dental.toml
