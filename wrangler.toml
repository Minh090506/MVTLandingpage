name = "escape-myvivatour"
main = "worker.js"
compatibility_date = "2024-01-01"

# Edge-inbox replay + retention cron. LEAD_REPLAY_HOSTS keeps this worker from
# replaying the dental worker's rows (and vice versa).
[triggers]
crons = ["*/10 * * * *"]

[vars]
LEAD_REPLAY_HOSTS = "escape.myvivatour.com,happytours.myvivatour.com"

# Per-IP rate limit for POST /api/lead (Workers Rate Limiting binding; needs
# wrangler >= 4.36). The handler tolerates a missing binding (no limit enforced).
[[ratelimits]]
name = "LEAD_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
